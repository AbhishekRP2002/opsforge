[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-itops_env"
version = "0.1.0"
description = "OpsForge IT operations environment for OpenEnv"
requires-python = ">=3.11"
dependencies = [
    "openenv==0.4.2",
    "fastmcp==3.4.7",
    "mcp==1.30.0",
    "httpx>=0.28.1",
    "websockets>=15.0.1",
    "fastapi>=0.115",
    "starlette>=0.40",
    "uvicorn>=0.35",
    "jsonschema>=4.0",
    "pydantic>=2.12",
]

[project.optional-dependencies]
verifiers = [
    "verifiers==0.3.1; python_version < '3.14'",
]
dev = [
    "pyright",
    "pytest>=8.0.0",
    "ruff>=0.14.0",
    "verifiers==0.3.1; python_version < '3.14'",
]

[project.scripts]
# Server entry point - enables running via: uv run --project . server
# or: python -m itops_env.server.app
server = "itops_env.server.app:main"

[tool.setuptools]
include-package-data = true
py-modules = ["opsforge_verifiers"]
packages = ["itops_env", "itops_env.harness", "itops_env.integrations", "itops_env.integrations.verifiers", "itops_env.server", "itops_env.server.interfaces", "itops_env.server.mcp_servers", "itops_env.server.mcp_servers.benchmark", "itops_env.server.mcp_servers.okta", "itops_env.server.mcp_servers.servicenow", "itops_env.server.mcp_servers.erpnext", "itops_env.server.mcp_servers.darwinbox", "itops_env.server.core", "itops_env.server.storage", "itops_env.server.services", "itops_env.resources", "itops_env.resources.development", "itops_env.server.storage.migrations"]
package-dir = { "itops_env" = ".", "itops_env.server" = "server" }

[tool.setuptools.package-data]
"itops_env.server.storage.migrations" = ["*.sql"]
"itops_env.resources.development" = ["*.json"]

[tool.uv.config-settings]
# Expose the mapped itops_env package through paths that static checkers can read.
editable_mode = "strict"

[tool.pyright]
include = ["*.py", "harness", "integrations", "server", "resources", "examples", "tests"]
exclude = [".venv", "build", "dist"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
