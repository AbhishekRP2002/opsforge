[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-itops_env"
version = "0.1.0"
description = "OpsForge IT operations environment for OpenEnv"
requires-python = ">=3.11"
dependencies = [
    "openenv==0.4.2",
    "fastmcp==3.4.7",
    "mcp==1.30.0",
    "httpx>=0.28.1",
    "websockets>=15.0.1",
    "fastapi>=0.115",
    "starlette>=0.40",
    "uvicorn>=0.35",
    "jsonschema>=4.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.14.0",
]

[project.scripts]
# Server entry point - enables running via: uv run --project . server
# or: python -m itops_env.server.app
server = "itops_env.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["itops_env", "itops_env.server", "itops_env.server.interfaces", "itops_env.server.mcp_servers", "itops_env.server.core", "itops_env.server.storage", "itops_env.server.services", "itops_env.resources", "itops_env.resources.development", "itops_env.server.storage.migrations"]
package-dir = { "itops_env" = ".", "itops_env.server" = "server" }

[tool.setuptools.package-data]
"itops_env.server.storage.migrations" = ["*.sql"]
"itops_env.resources.development" = ["*.json"]
